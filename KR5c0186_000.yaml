  text: 正一法文天師教戒科經力六道以沖和為德以不和相尅是以天地合和萬物萌生華英熟成國家合和天下太平萬姓安寧室家合和父慈子孝天垂福慶賢者深思念焉豈可不和天地不和隂陽失度冬雷夏霜水旱不調萬物乾陸華葉燋枯國家不和君臣相詐強弱相陵夷狄侵境兵鋒交錯天下擾攘民不安居室家不和父不慈愛子無孝心大小忿錯更相怨望積怨含毒鬼亂神錯家致敗傷此三事之怨皆由不和天地不和隂陽錯謬災害萬物國家不和豪傑爭權禁令不行害及萬民室家不和禍起貪欲財利者忿怒相加以致災殃諸賢者所以反覆相解恐人説習非法來久躬行犯惡然後得罪不能發悟或懷怨望其過益深故重丁寧皆宜用心轉相勸進除去巳往之惡修今來之善善積合道神定體安喜怒不忿於心惡言不發於口醜聲不聞於耳邪色不視於目貪欲不專於意修行正身真氣來附邪惡皆去故過悉除新善自著諸欲奉道不可不勤事師不可不敬事親不可不孝事君不可不忠已身不可不寶教戒不可不從同志不可不親外行不可不愚內實不可不明語言不可不慎禍患不可不防明者不可不請愚者不可不教仁義不可不行施惠不可不作孤弱不可不恤貧賤不可不濟厄人不可不度生物不可殺伐惡事不可不避色欲不可不絶貪利不可不逺酒肉不可不節善人不可不敬惡人不可不勸也賢者深念之焉為人若不能與法戒相應身心又無功德欲求天福難矣修善得福為惡得罪罪至不自責先曰過反呼奉道無益怨咎皇天猶豫前却移心他念群輩翕習妖惑萬端結黨連群導趣邪偽陷入姦非愚人無知為行如此去道逺矣道之弘大方圓無外天網恢羅人處其中如大網捕魚魚為遊行網中豈知表有網也牽網便得放網乃脫人不知真道大神如魚之不知網也而愚人或欲捨真就偽偽𠆸卒效登時或能有利利不久也叛道者所以不即受罰大道含弘愛惜人命聽恣其意隨其所欲雖初快心後自當悔之深逺非愚俗所能明知道之視人如人之視蟲蟻道能殺人如人能殺蟲也道之好生惡殺終不殺也惡人為惡不止自有司神記其惡事過積罪滿執殺者自罰之道終不殺也諸賢者欲除害止惡當勤奉教戒戒不可違道以無為為上人過積但坐有為貪利百端道然無為故能長存天地法道無為與道相混真人法天無為故致神仙道之無所不為人能修行執守教戒善積行者功德自輔身與天通福流子孫賢者所樂愚者所不聞學者勉自殷勤天師設教施戒奉道明訣上德者神仙中德者倍壽下德者增年不橫夭也按戒為惡者乃不盡壽而橫天也惡人痛哉賢者何不修善久視長生乎雖不能及中德修下德治身世間斷絶愛欲反俗所為則與道合一不得淫泆不止志意邪念勞神損精魂魄不守則痛害人二不得情性暴怒心忿口泄揚聲罵詈誓盟呪詛呼天震地驚神駭鬼數犯不攺積怨在內傷損五藏五藏以傷病不可治又奉道者身中有天曹吏兵數犯瞋恚其神不守吏兵上詣天曹白人罪過過積罪成左契除生右契著死禍小者罪身罪多者殃及子孫三不得佞毒含害嫉賴於人專懷惡心心神五藏之主而專念惡事此一神不安諸神皆怒怒則刻壽最不可犯之不止其災害巳四不得穢身荒濁飲酒迷亂變易常性狂悖無防不知官禁為忌不知君父為尊罵詈溢口自詛索死發露隂私反迷不順淫于骨肉罵天詈地無底無對舉刃自守故天遂其殃自受其患五不得貪利財貨財貨糞壤隨時而與下古世薄以財為寶專念求利買賤賣貴伺候便宜欺誣百姓得所欲者心懷喜悅不得所欲者怨恨毒心或忿爭多少刀兵相賊違犯天禁不從教戒貪欲愛財財者害身之讎身沒名滅何用財為聞戒者翕然稱之言善謂不可犯背戒向利不自專者忽然復動輒有履險導刃之厄大命傾矣臨敗而欲悔罪定而稱善事失以過天道不救財寶色欲陷目之錐害身之災賢者逺之愚者樂之賢者坐起寐卧舉動行止深用自戒自戒身無變動其福明矣觀今奉道精專者萬無一人何以言之下古世薄時俗使然競相髙上貪榮富貴仁義不行權詐為智父子相欺君頤相紿轉相屬託貨賂賣官黜退忠直任用佞邪厚姦結黨阿諛所親富貴相追貧賤棄捐服飾車馬浮華順俗君子小人皆共同然所以欣欣世間豈念道乎此輩愚人雖先休休不足願也所以者何愚人淺薄適有榮顯便驕奢盈溢施行過度恣心快意不慎法節道之清虛不受此輩神明逺之邪鬼侵之或有協偽背真禱鬼求請天網恢恢其罰未行耳譬如炊熟火下以滅甑中餘氣未盡勢安得久惡人雖未遇禍譬如餘氣耳諸賢者人之所大願以生年為貴人之所大惡以死終為賤豈不然乎天道平正以生賞善以死罰惡此吉凶禍福從窈𡨋中來禍災非富貴者求請而可避非貧賤者守窮而故罰修善者福至為惡者禍來國君雖有無極之寶臨危惜命傾城量金求生乞活豈復可得賢者貧賤不須強求富貴勞人精思廢人所存傲慢亂志使人不壽而人見富貴者心欲願之志欲存之勞心苦志得之不弘若欲所求乞修身念道室家大小和同心意掃除燒香清淨嚴潔然具白開啓説其所欲道之降伏何所不消若願欲者實不用金帛貨賂不用人事求請不用酒肉祭禱直歸心於道無為而自得得之隨意則信為鬼立功𧵥物而巳亦不用多而欲習效俗人背道求請事事反矣欲得福願要當勤身精進晨暮清淨燒香坐起念之不廢所願福無不應好樂者得福無量不樂者自隨本心道至寬弘恣隨人耳唯賢者明焉念念精進追之恐不及愚者忽忽退然去之恐不逺此賢愚不同也學者勉自勤請奉道之家或遇災異疾病死喪官符口舌以致不利何以然也皆由人愚奉法不勤雖知道尊而欲奉之其情性施行與俗不别邪偽不除欲以邪偽干亂真正終不可也邪與正如賊盜惡人見監伺吏藏竄無住立處豈可犯尊其氣自然不通如何欲與邪相通也諸此人輩雖係名奉道冀道當祐道不受也而自謂屬道遇災急厄病痛著身雖望道擁護道不救也精邪惡鬼卒所侵害道不為攝却而惡人憧愚殊不能尅心改悔歸誠於道方更背戾呼道不神雖不口言心內怨望此輩不莊事變易心腸巽濡日月冀脫災免害萬不一脫執性了戾心腸不改沒命之後悔復何及愚人痛哉賢者正心守道不可懈惰當以勤確愚者自戒莊事勤修大道至尊髙而無上周圓無表裏囊括天地制御衆神生育萬物蜎飛蠕動含氣之類皆道所成所生道之威神何所不集何所不消何所不伏把持樞機驅使百鬼先天而生長守無窮人處其間年命奄忽如眼目視瞬間耳而大道含弘乃愍人命短促故教人修善上備者神仙中備者地仙下備者增年道尊巍巍何求於人人不能感存道恩精勤修善雖不能及中德之行下德當備也而復不及下德違背真正不從教戒但念愛欲富貴榮祿色利財寶飲酒食肉恣心快意驕奢盈溢豈復念道乎人不念道道不念人人之若魚道之若水魚得水而生失水而死道去人虛何望久生也要在精進存念諸賢者欲得保身念行家居安完皆去先日所犯過惡進修後善若見人有違失之行轉相勸戒相教改悔其功報效應受福無量勿謂道之無形不可見為欲傲慢輕易耳然欲得恩福當事精勤晨夜清靜若有同義遇難疾病相救緩急相恤不得以智欺愚乘威詐稱假託鬼神恐嚇厄人不得才有小智稱名自大輕忽愚人更相毀呰背向妄論指摘賢者不得私情貪狠敬貴恥賤樂富棄貧託望憍氣愛憎二心欲隨情請福以為惠施道終不從鬼不為使毀敗正法耳反受咎當同志相求同法相好若男女不曉書疏者專心好道可請明者聽誦經戒會在靜舍若堂上掃除燒香澡浣潔清男女别坐儼然正體安神精思明聽勿妄華言傾邪不端遊心他念玩墮睡寐勞體自疲虛苦無益若能如戒精進不倦室家受福天曹吏兵自來護人終已無有災患病痛也萬物之中以人為貴人處天地間皆知生之日而不知死來之日善人惡人富貴貧賤各自謂壽命終年誰欲先窮者人人所不樂也然惡人過積結罪罪滿作病病成至死不自知唯修善者得福人生受命制之在天天實不言故在聖人聖人隨世惻隱不以常存故遺教戒教戒者欲令人勸進長生全身保命無窮人皆能奉法不倦何但保命乃有延年無窮之福此非富貴者貨賂求請所能得通也亦非酒肉祭禱鬼神所降致也道人賢者奉敬教戒精專勤身先苦後報其福應也賢愚貴賤皆同亦願其所欲耳唯道人執志故能以戒自檢行止舉動愛欲之間守戒不違心無邪傾若見色利以戒掩目若聞好惡之言以戒塞耳若食甘香之美以戒杜口若願想財寶放情愛欲以戒挫心若趣向姦非意欲惡事以戒折足守之不廢可謂明矣當勸進愚冥者愚冥者不能承用無如之何以道人常欲有好心善施惠故也天道授福奉道精進要當勤身守之當久治志當堅精進專念莫有不先勞後報度身神仙故有楊公十五奉道六十未報修身不倦至年八十功滿行著福報無量諸賢者奉道莊事勤身當如飢渴欲得飲食如遇寒暑欲得易處如作極欲得休息如疲勞欲眠寐如願想欲有所得念道奉真欲得度身如念此諸所欲勉身如法不倦獲無災殃禍害病痛憂患何願不得何福不應也道出自然先天地生號無上玄老太上三氣混一為無上正真之道也道弘大包含天地變化萬神微布散在八極之外內潛毫毛之中成生萬物制御三天統三萬六千神大無不覆小無不入清虛無為故能長存含濁而不穢故為萬物母天道無親惟與善人善人保之以致神仙非富貴者求而能得貧賤者鄙而無與能專心好樂精誠思念修身行善則與道合然世人多愚好尚浮偽遊身恣欲於群俗之間須臾之樂以快腹目終不能苦身勤念奉道奉道但當積修功德謙讓行仁義柔弱行諸善清正無為初雖勤苦終以受福不與俗同如人但貪須臾之利命沒之後身為糞土魂神同朽道人與俗相去逺矣何以言之道人清正名上屬天俗人穢濁死屬地官豈不逺乎愚人守俗不念奉道可謂大迷也夫人各有眼目鼻口心意兩足其賢愚之行各異者目專視利色耳聽言之好惡鼻恱於甘香之氣口貪五味之美心專縱恣所欲兩足隨意導身趣向姦非賢者不然目不視所好耳不外聽邪惡之言鼻不通臭香之氣口不樂滋味之美心不想可欲之快足不趨惡事為非此道人所行道人亦知諸所欲為快以戒制情故不犯惡善積行著與道法相應受福無極愚人所知惡速禍不能專戒與道相反何望得福若欲得福何不效道人乎奉道清正無為惟當精進修行積善耳亦無間為限亦無水火為難亦無貧賤見逆亦無豪強相奪亦無富貴爭進亦無作役負簷之苦何不壯事專精奉道勤身乎道人百行當備千善當著雖有九百九十九善一善未滿中為利動皆棄前功治身關念守戒不廢乃得度世道人賢者可勤行焉
