body:
  text: 大道家令戒大道者包囊天地係養群生制御萬機者也無形無像混混沌沌自然生百千萬種非人所能名自天地以下皆道所生殺也道授以微氣其色有三玄元始氣是也玄青為天始黃為地元白為道也三氣之中制上下為萬物父母故為至尊至神自天地以下無不受此氣而生者也諸長久之物皆能守道含氣有精神乃能呼吸隂陽道生天天生地地生人皆三氣而生三三如九故人有九孔九氣九氣通則五藏安五藏安則六府定六府定則神明神明則親道是故人行善守道慎無失生道生道無失德三三者不離故能與天地變易易稱有天地然後有萬物有萬物然後有男女有男女然後有夫婦有夫婦然後有父子父子者欲係百世使種姓不絶耳下古世薄多愚淺但愛色之樂淫於邪偽以成耳目淫溢女色精神勃亂貪惜貨賂沴氣發上自生百病至於黃帝以來民多機巧服牛乘馬貨賂為官稍稍欲薄盡于五帝夏商周三代轉見世利秦始五霸更相尅害有賊死者萬億不可勝數皆由不信其道道乃世世為帝王師而王者不能尊奉至傾移顚殞之患臨危濟厄萬無一存道重人命以周之末世始出奉道於琅瑘以授干吉太平之道起於東方東方始欲濟民於塗炭民往往欲信道初化氣微聽得飲食隂陽化寬至於父母兄弟酌祭之神後道氣當布四海轉生西關由以太平不備悉當須明師口訣指謫為符命道復作五千文由神仙之要其禁轉切急指勑治身養生之要神仙之説付關令尹喜略至而世多愚心復悶悶死者如崩萬無有全西入胡授以道法其禁至重無隂陽之施不殺生飲食胡人不能信道遂乃變為真仙仙人交與天人浮遊青雲之間故翔弱水之濵胡人叩頭數萬貞鏡照天髠頭剔鬚願信真人於是真道興焉非但為胡不為秦秦人不得真道五霸世衰赤漢承天道佐代亂出黃石之書以授張良道亦形變誰能識真漢世既定末嗣縱橫民人趣利強弱忿爭道傷民命一去難還故使天授氣治民曰新出老君言鬼者何人但畏鬼不信道故老君授與張道陵為天師至尊至神而乃為人之師汝曹輩足可知之為尊於天地也而故悶悶日一日月一月歲一歲貪縱口腹放恣耳目不信道死者萬數可不痛哉道以漢安元年五月一日於蜀郡臨邛縣渠停赤石城造出正一盟威之道與天地劵要立二十四治分布玄元始氣治民汝曹輩復不知道之根本真偽所出但競貪髙世更相貴賤違道叛德欲隨人意人意樂亂使張角黃巾作亂汝曹知角何人自是以來死者為幾千萬人邪道使末嗣分氣治民漢中四十餘年道禁真正之元神仙之説道所施行何以想爾妙真三靈七言復不真正而故謂道欺人哀哉可傷至義國殞顛流移死者以萬為數傷人心志自從流徙以來分布天下道乃往往救汝曹之命或決氣相語或有故臣令相端正而復不信甚可哀哉欲朝當先暮欲太平當先亂人惡不能除當先兵病水旱死汝曹薄命正當與此相遇雖然吉人無咎昔時為道以備今來耳未至太平而死子孫當蒙天恩下世浮薄持心不堅新故民戶見世知變便能改心為善行仁義則善矣可見太平度脫厄難之中為後世種民雖有兵病水害之災臨危無咎故曰道也子念道道念子子不念道道不念子也故民諸職男女汝曹輩莊事修身潔己念師奉道世薄乃爾夫婦父子室家相守當能久而不能相承事清貞孝順道敬師禮鬼從神乎今已去天下之擾擾如羊四方兵病惡氣流行念今日之善尊天敬神愛生行道念為真正道即愛子子不念道道即逺子卒近災害慎無復悔悔當苦在後身吾晨夜周流四海之內行於八極之外欲令君仁臣忠父慈子孝夫信婦貞兄敬弟順天下安靜故民渾濁日久雖聞神仙之語長生之言心迷意惑更懷不信或行善未知真正愚愚相教邪邪相傳不自屏惡更相謗訕君臣爭勢父子不親夫婦相嫉兄弟生分因公行男女輕淫違失天地敗亂五常外是內非亂道紀綱至今三天恚怒殺氣縱橫五星失度太白揚光變風冬雷彗孛低昻天垂懸像以示人人不信道道恚死者當氣在幽谷妙真自吾所作黃庭三靈七言皆訓喻本經為道德之光華道不欲指形而名之賢者見一知萬譬如識音者道在一身之中豈在他人乎汝曹學善夫根本不承經言邪邪相教就偽棄真吾昔皆録短紙雜説邪文悉令消之祭酒無狀故俾挾深藏于今常存使今世末學之人好尚浮説指偽名真此皆犯天禁必當中傷終不致福也但勞汝耳無事自勤苦不如任心恣意以快汝不須為天考不須輕易官法也化以太平人當助天為太平之行天聰明自我民聰明中五正則二五定亦從人為嚮應耳諸新故民戶男女老壯自今正元二年正月七日已去其能壯事守善能如要言臣忠子孝夫信婦貞兄敬弟順內無二心便可為善得種民矣種民難中亦當助其力若好生樂道無老壯端心正意助國扶命善惡神明具自知之不可復為妄想或以邪偽之人言言我知道以道教人諸職男女官昔所拜署今在無幾自從太和五年以來諸職各各自置置不復由吾氣真氣領神選舉或聽決氣信內人影夢或以所奏或迫不得已不按舊儀承信特説或一治重官或職治空決受職者皆濫對天地氣候理三官文書事身厚食奉及諸間官無文書之職皆當隨時坐起名荷天官常處神明之坐以憍世俗非忠臣孝子之道曽不知悉語聞災責已如逢災遇害如反怨妄言奉道無益此乃有罪三千從爾如已也吾昔勤勤憂濟汝曹之命欲令見太平耳而復求太平耶昔漢嗣末世豪傑縱橫強弱相陵人民詭黠男女輕淫政不能濟家不相禁抄盜城市怨枉小人更相僕役蠶食萬民民怨思亂逆氣干天故今五星失度彗孛上掃火星失輔強臣分爭群姦相將百有餘年魏氏承天驅除歷使其然載在河雒懸象垂天是吾順天奉時以國師命武帝行天下死者填坑既得吾國之光赤子不傷身重金纍紫得壽遐亡七子五侯為國之光將相掾屬侯封不少銀銅數千父死子係弟亡兄榮沐浴聖恩汝輩豈志德知真所從來乎昔日開門教之為善而反不相聽從今吾避世以汝付魏清政道治千里獨行虎狼伏匿卧不閉門姦臣小竪不知天命逆順強為妖妄造者輒凶及于子孫汝輩豈知其原耶從比年以來四方疾病掃除群凶但殺惡人耳其守道樂善天自護之如赤子臨危度脫如舌之避齒汝曹豈復知之耶諸職自今以後不得妄自署置為職也復違吾中傷勿怨祭酒治病病來復差既差復病此為惡人勿復醫治之但當戶戶自相化以忠孝父慈子孝夫信婦貞兄敬弟順朝暮清淨斷絶貪心棄利去欲改更惡腸憐貧愛老好施出讓除去淫妬喜怒情念常和同腹目助國壯命棄往日之惡從今日之善行災消無病得為後世種民民勿怨貧苦貪富樂尊貴汝耳目聞見從古以來富貴者久乎財棄於地身死於市以此觀之故諺言死人不如生鼠得之在命求之以道道隱無名名者伐身之斧善行無轍迹欲令人不見其蹤迹為道當治身養生求福耳而教人以縱已縱已則人見其迹伐身之斧利矣伐身之斧利則福去而禍來可不慎歟可不畏歟天地所以長久者以其無為無為者無不為也但使人不見其有迹乃能為竒耳俗人輩汝曹狀可笑也才有小善欲使人知之才有粉米之異欲使人賢之此皆非道之益已皆犯禁矣今傳吾教令新故民皆明吾心勿相負也天師教今故下教作七言謝諸祭酒男女民天地混籍氣如煙四時五行轉相因天地合會無人民星辰倒錯為人先二十八宿畢參辰熒惑太白出其間若有改變垂象先太平之基不能眠是令轗軻不可言發言出教心意煩走氣八極周復還觀視百姓夷胡秦不見人種但尸民從心恣意勞精神五藏虛空為尸人命不可贖屬地官身為鬼伍入黃泉思而改悔從吾言可得升度為仙人節慎隂陽保愛神五藏六府有君臣積在微微為真人神思愁慘不能眠遊戲百姓五藏間還與真人共語言心中真人來上天絳黃單衣三縫冠佩天玉符跪吾前陳説百姓道萬民功過進退有明文陽平治教謝二十四治五氣中氣領神四部行氣左右監神治頭祭酒别治主者男女老壯散治民吾以漢安元年五月一日從漢始皇帝王神氣受道以五斗米為信欲令可仙之士皆得升度汝曹輩乃至爾難教叵與共語反是為非以曲為直千載之會當奈汝曹何吾從太上老君周行八極按行民間選索種民了不可得百姓汝曹無有應人種者也但貪榮富錢財穀帛錦綺絲綿以養妻子為務掠取他民戶賦斂索其錢物掠使百姓專作民戶修農煆私以養妻奴自是非他欲得功名榮身富已苟貪錢財室家不和姤嫉為先男女老壯更相説道轉相誹謗溢口盈路背向異辭言語不同轉相説嫉不恤鬼神以憂天道令氣錯亂罪坐在阿誰各言祕教推論舊事吾不能復忍汝輩也欲持汝輩應文書頗知與不祭酒主者男女老壯各爾憒憒與俗無别口是心非人頭蟲心房室不節縱恣淫情男女老壯不相呵整為爾憒憒群行混濁委託師道老君太上推論舊事攝綱舉網前欲推治諸受任主者職治祭酒十人之中誅其三四名還天曹考掠治罪汝輩慎之氣將欲急逺不過一年二年三年之中當令汝曹聞知當令汝輩眼見可不慎之諸祭酒主者中頗有舊人以不從建安黃初元年以來諸主者祭酒人人稱教各作一治不復按舊道法為得爾不令汝輩按吾陽平鹿堂鶴鳴教行之汝輩所行舉舊事相應與不吉吾有何急急轉著治民決氣下教語汝曹輩老君太上轉相督欲令汝曹人人用意勤心努力復自一勸為道盡節勸化百姓天師五言牽三詩牽三復牽一披雲朗白日三災蕩穢纍約當被中出牽三復牽二榮華不足利若欲入五難必令精誠至牽三復牽三酒肉不足甘洗濯素絲質𢌿苦就朱藍牽三復牽四妙法冥中祕希仰神靈降一心莫有二牽三復牽五道士出蓬戶脫落形骸中淵玄誰能覩牽三復牽六年往不可逐雖無骨間分訓之故宜朂牽三復牽七希仰入九室披襟就靈訓喧然萬事畢大道妙不逺弘之當由人忠信成一氣可得脫度身三災運已促宜早去利欲中情漸堅固災厄便得度心罪宜詳除勉力可為則既得過五難衆願咸可得恨無自然分纒綿流俗間仰意歸長生庶得廁群賢正一法文天師教戒科經
